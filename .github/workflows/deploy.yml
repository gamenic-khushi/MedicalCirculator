name: Deploy to Appwrite

on:
  push:
    branches: [development]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Appwrite CLI
        # Tried bumping this to 26.0.0 to see if it was a version-skew problem
        # with the server (1.9.0) — it wasn't: the function push failed with
        # the exact same "not found" error on 26.0.0, and the newer CLI
        # additionally made the site push a hard failure over a "rules.read"
        # scope self-hosted API keys can't even be granted (no such scope
        # exists in this project's key-scope picker), a regression from
        # 17.4.0 just logging it as a non-fatal warning. Back on 17.4.0 while
        # the real function-push cause gets diagnosed with --verbose below.
        run: npm install -g appwrite-cli@17.4.0

      - name: Deploy to Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"

          appwrite push site --site-id medicalCirculator --activate=true --force
          appwrite push function --function-id resolveProximityTiebreak --activate=true --force --verbose --report
