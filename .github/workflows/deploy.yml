name: Deploy to Appwrite

on:
  push:
    branches: [development]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Appwrite CLI
        # 17.4.0 predates the self-hosted server's current version (1.9.0) and
        # couldn't find an existing function by ID anymore (push function kept
        # failing with "Function 'resolveProximityTiebreak' not found" even
        # though the function exists and the key has functions.read/write) —
        # the site push kept working since that's a newer, simpler API.
        run: npm install -g appwrite-cli@26.0.0

      - name: Deploy to Appwrite
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"

          appwrite push site --site-id medicalCirculator --activate=true --force
          appwrite push function --function-id resolveProximityTiebreak --activate=true --force
